name: Run notebooks and collect outputs

on:
  workflow_dispatch:
  push:
    paths:
      - "notebooks/*.ipynb"
      - "src/**/*.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  run-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert nbclient ipykernel

      - name: Create output directories
        run: |
          mkdir -p figures results docs

      - name: Run notebooks
        run: |
          for nb in notebooks/[0-9][0-9]_*.ipynb; do
            echo "Running $nb"
            jupyter nbconvert \
              --to notebook \
              --execute "$nb" \
              --inplace \
              --ExecutePreprocessor.timeout=600
          done

      - name: Commit generated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update notebook outputs"
          file_pattern: |
            notebooks/*.ipynb
            figures/*
            results/*
            docs/*
